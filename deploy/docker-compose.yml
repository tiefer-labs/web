# Production stack for https://tiefer.space: Caddy (TLS) in front of the
# Go server. Usage, from the repository root:
#
#   cp .env.example deploy/.env    # then fill in production values
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Both containers run without Linux capabilities (Caddy keeps only the one
# it needs to bind ports 80 and 443), with a read-only file system and
# no-new-privileges. The Go server is not published on the host; only
# Caddy is reachable from outside.

name: tiefer

services:
  app:
    build:
      context: ..
    image: tiefer-web:latest
    restart: unless-stopped
    env_file: .env
    environment:
      ENV: production
      PORT: "8080"
      SITE_URL: https://tiefer.space
      TRUST_PROXY: "true"
    expose:
      - "8080"
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    cpus: 1.0
    networks:
      - web
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  caddy:
    # caddy:2 (2.11.4), pinned by digest.
    image: caddy:2@sha256:0c994536bddb66445885237f1a5dcc1916bccea922661c76b4e9fc24061f9b52
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/.env for Let's Encrypt}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 256
    networks:
      - web
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

networks:
  web: {}

volumes:
  caddy_data: {}
  caddy_config: {}

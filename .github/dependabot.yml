# Weekly update proposals for everything that is pinned: the Go toolchain,
# the Docker base images (by digest) and the GitHub Actions (by SHA).
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    target-branch: dev
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /deploy
    target-branch: dev
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly

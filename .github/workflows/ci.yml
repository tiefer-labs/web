# SPDX-License-Identifier: MPL-2.0

name: CI

# Pushes to main run this workflow through deploy.yml.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Route types
        run: pnpm next typegen
      - name: TypeScript, Oxfmt, Oxlint and Vitest (including the copy rules and licence headers)
        run: pnpm check --strict
      - name: Build
        run: pnpm build

  infra:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and lint the Bicep templates (offline, nothing is deployed)
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build-params --file infra/main.bicepparam --stdout > /dev/null
          az bicep lint --file infra/main.bicep

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build -t tiefer-web:local .
      - name: Run it locked down and probe it
        run: |
          docker run -d --name web --read-only --tmpfs /app/.next/cache:uid=65532 --cap-drop=ALL \
            --security-opt=no-new-privileges -p 127.0.0.1:8080:8080 \
            -e CSRF_SECRET="$(openssl rand -hex 32)" tiefer-web:local
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsSI http://127.0.0.1:8080/ | tee headers.txt
          grep -qi '^content-security-policy:' headers.txt
          ! grep -qi '^x-powered-by:' headers.txt
          test "$(docker inspect -f '{{.Config.User}}' tiefer-web:local)" = "65532:65532"
      - name: Stop
        if: always()
        run: docker rm -f web || true

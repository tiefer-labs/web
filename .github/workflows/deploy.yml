# Builds the image, pushes it to Azure Container Registry and points the
# web app at it. Azure login uses OpenID Connect with the deploy identity
# from infra/: no password or key is stored in GitHub. The identity only
# trusts runs in the "production" environment (see infra/README.md).

name: Deploy

# Manual only until the Next.js site is deployed to Azure for the first time; then add back:
#   push:
#     branches: [main]
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      # Identifiers, not secrets: set them as environment variables of the
      # GitHub "production" environment.
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      WEBAPP: ${{ vars.AZURE_WEBAPP_NAME }}
      REGISTRY: ${{ vars.AZURE_REGISTRY_LOGIN_SERVER }}
      SITE_URL: https://tiefer.space
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Build and push the image
        run: |
          image="$REGISTRY/tiefer-web:$(git rev-parse HEAD)"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          az acr login --name "${REGISTRY%%.*}"
          # Pages are prerendered in the image, so their public settings are build arguments.
          docker build --pull -t "$image"             --build-arg SITE_URL="$SITE_URL"             --build-arg CONTACT_EMAIL="${{ vars.CONTACT_EMAIL }}"             --build-arg LINKEDIN_URL="${{ vars.LINKEDIN_URL }}"             --build-arg REPO_URL="${{ vars.REPO_URL }}"             --build-arg SMTP_HOST="${{ vars.SMTP_HOST }}"             --build-arg CONTACT_TO="${{ vars.CONTACT_TO }}"             --build-arg CONTACT_FROM="${{ vars.CONTACT_FROM }}"             --build-arg LEGAL_NAME="${{ vars.LEGAL_NAME }}"             --build-arg LEGAL_FORM="${{ vars.LEGAL_FORM }}"             --build-arg LEGAL_ADDRESS="${{ vars.LEGAL_ADDRESS }}"             --build-arg LEGAL_TAX_ID="${{ vars.LEGAL_TAX_ID }}"             --build-arg LEGAL_REGISTRATION="${{ vars.LEGAL_REGISTRATION }}"             --build-arg LEGAL_DIRECTOR="${{ vars.LEGAL_DIRECTOR }}"             --build-arg LEGAL_HOSTING_PROVIDER="${{ vars.LEGAL_HOSTING_PROVIDER }}"             --build-arg LEGAL_HOSTING_COUNTRY="${{ vars.LEGAL_HOSTING_COUNTRY }}"             --build-arg LEGAL_SMTP_PROVIDER="${{ vars.LEGAL_SMTP_PROVIDER }}"             --build-arg LEGAL_SMTP_COUNTRY="${{ vars.LEGAL_SMTP_COUNTRY }}"             --build-arg LEGAL_REVIEWED="${{ vars.LEGAL_REVIEWED }}"             --build-arg LOG_RETENTION_DAYS="${{ vars.LOG_RETENTION_DAYS }}"             --build-arg HSTS_PRELOAD="${{ vars.HSTS_PRELOAD }}"             .
          docker push "$image"
      - name: Point the web app at the new image
        run: |
          az webapp config set --resource-group "$RESOURCE_GROUP" --name "$WEBAPP" \
            --linux-fx-version "DOCKER|$IMAGE" --output none
      - name: Smoke test through Front Door
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$SITE_URL/healthz"; then break; fi
            sleep 10
          done
          curl -fsSI --max-time 10 "$SITE_URL/" | tee headers.txt
          grep -qi '^content-security-policy:' headers.txt
          grep -qi '^strict-transport-security:' headers.txt
